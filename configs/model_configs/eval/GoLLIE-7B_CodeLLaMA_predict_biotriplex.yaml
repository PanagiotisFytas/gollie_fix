#Training args
model_name_or_path: HiTZ/GoLLIE-7B
torch_dtype: bfloat16
use_lora: true
quantization: null
quantization_inference: null
bf16_full_eval: true
gradient_checkpointing: true
force_auto_device_map: true
use_flash_attention: true
#deepspeed: configs/deepspeed_configs/deepspeed_zero2.json

# dataset arguments
dataset_dir:
  /mnt/nas_home/pf376/Documents/gollie_fix/data/processed_w_examples
train_tasks:
  - biotriplex.ner
  - biotriplex.rc
  - biotriplex.re
validation_tasks:
  - biotriplex.ner
  - biotriplex.rc
test_tasks:
  - biotriplex.ner
  - biotriplex.rc
  - biotriplex.re
max_examples_per_task_train: 30000
max_examples_per_task_val: 5000
max_examples_per_task_test: null
max_seq_length: 6096
generation_max_length: 4096
ignore_pad_token_for_loss: true
prompt_loss_weight: 0.0

# checkpoint settings
output_dir: /mnt/nas_home/pf376/Documents/gollie_fix/check/GoLLIE+-7b_CodeLLaMA_biotriplex
overwrite_output_dir: true
load_best_model_at_end: false
save_strategy: "epoch"
save_steps: 1000
save_total_limit: 999

# evaluation
do_train: false
do_eval: fasle
do_predict: true
evaluation_strategy: "epoch"
eval_steps: 250
eval_delay: 0
predict_with_generate: true
evaluate_all_checkpoints: false

# batch size: 16 batch size * 8 gradaccum * 1 GPUs = 128
per_device_train_batch_size: 1
per_device_eval_batch_size: 1
gradient_accumulation_steps: 1
generation_num_beams: 1

# optimizer settings
optim: adamw_torch
learning_rate: 0.0001
weight_decay: 0.001
num_train_epochs: 3
lr_scheduler_type: cosine
warmup_ratio: 0.03
adam_epsilon: 1e-7

# lora settings
lora_r: 8
lora_alpha: 16
lora_dropout: 0.05
lora_target_modules:
  - all

# reporting
logging_strategy: steps
logging_first_step: true
logging_steps: 25
report_to: wandb
run_name: "GoLLIE+-7b_CodeLLaMA_Biotriplex"
disable_tqdm: false

# hub settings
push_to_hub: false
resume_from_checkpoint: false

# performance
bf16: true
fp16: false
torch_compile: false
ddp_find_unused_parameters: false
